name: Metrics
on:
  # Mise à jour quotidienne automatique à minuit
  schedule:
    - cron: "0 0 * * *"
  # Permet d'exécuter l'action manuellement depuis l'onglet Actions sur GitHub
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Utilise le secret METRICS_TOKEN (PAT) pour accéder aux organisations et à tous les repos
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

          user: NewGamer62
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Paris
          
          # Prise en compte de tous les dépôts (personnels, collaborateurs et organisations)
          repositories_affiliations: owner, collaborator, organization_member
          repositories_batch: 100
          
          # Plugin Langages les plus utilisés
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_ignored: html, css, tex
